<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#059669">
    <meta name="description" content="帮助学生记下每天的学习任务，做完就打勾。">
    <title>AI 学生工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M9 22c5-.6 9-5 11-12-6 .8-10 5.4-11 12z' fill='%23d1fae5'/%3E%3Cpath d='M16 11c.8 3.2.7 6.2-.2 9' stroke='%23047857' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-sun"></span>
      <span class="blob blob-sky"></span>
      <span class="blob blob-peach"></span>
    </div>

    <main class="app">
      <header class="hero">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="44" height="44">
              <rect width="48" height="48" rx="14" fill="#059669"/>
              <path d="M14 32c8-1 14-8 17-18-9 1.2-15 8-17 18z" fill="#d1fae5"/>
              <path d="M24 16c1.2 5 1 9-.2 13" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <circle cx="34" cy="14" r="3" fill="#fde68a"/>
            </svg>
          </span>
          <div>
            <p class="brand-name">AI 学生工作台</p>
            <p class="brand-date" id="today">今天</p>
          </div>
        </div>

        <div class="hero-grid">
          <div class="intro">
            <h1 id="greeting">你好，同学</h1>
            <p class="lede">写下今天要学的事，做完打个勾。<br>慢慢来，也会变成进步。</p>
          </div>

          <section class="progress-card" aria-live="polite">
            <div class="ring" id="ring">
              <span id="percent-label">0%</span>
            </div>
            <div class="progress-copy">
              <h2 id="progress-label">今日进度</h2>
              <p class="progress-count" id="progress-count">已完成 0 / 0</p>
              <p class="progress-hint" id="progress-hint"></p>
              <p class="cheer" id="cheer" hidden>全部完成啦，你真棒！</p>
            </div>
          </section>
        </div>
      </header>

      <section class="body">
        <form id="task-form" class="composer" autocomplete="off">
          <div class="subjects" id="subjects" role="radiogroup" aria-label="选择科目">
            <button type="button" class="chip" data-subject="chinese">语文</button>
            <button type="button" class="chip" data-subject="math">数学</button>
            <button type="button" class="chip" data-subject="english">英语</button>
            <button type="button" class="chip" data-subject="other">其他</button>
          </div>
          <div class="composer-row">
            <label class="sr-only" for="task-input">新的学习任务</label>
            <input
              id="task-input"
              type="text"
              maxlength="100"
              placeholder="例如：背诵《静夜思》"
              enterkeyhint="done"
            >
            <button type="submit" id="add-button">添加</button>
          </div>
        </form>
        <p id="form-hint" class="form-hint" role="status" hidden></p>
        <div class="filters" id="filters" role="group" aria-label="筛选任务">
          <button type="button" class="filter is-on" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter" data-filter="open" aria-pressed="false">未完成</button>
          <button type="button" class="filter" data-filter="done" aria-pressed="false">已完成</button>
        </div>
        <section id="focus" class="focus-card" hidden>
          <div class="focus-copy">
            <p class="focus-kicker" id="focus-kicker">正在专注</p>
            <p class="focus-task" id="focus-task"></p>
          </div>
          <p class="focus-clock" id="focus-clock" aria-hidden="true">25:00</p>
          <div class="focus-actions">
            <button type="button" id="focus-pause" class="mini">暂停</button>
            <button type="button" id="focus-stop" class="mini danger">结束</button>
            <button type="button" id="focus-done" class="mini primary" hidden>勾上这项</button>
          </div>
          <p id="focus-live" class="sr-only" role="status"></p>
        </section>

        <p class="empty" id="empty" hidden>还没有学习任务。在上面写下今天想完成的第一件事吧。</p>
        <ul class="tasks" id="task-list"></ul>
        <p class="footnote">任务存在本机浏览器里，删错了可以撤销。</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toast-text">已删除这项任务</span>
      <button type="button" id="toast-undo">撤销</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
